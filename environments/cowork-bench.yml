apiVersion: harness-rsi/v1alpha1
kind: EnvironmentAdapter
metadata:
  id: cowork-bench
  name: Cowork-Evolution-Benchmark Harbor Environment
spec:
  protocol: cowork-bench-docker-v1
  source:
    datasetRootEnvironment: RSI_COWORK_BENCH_DATASET_ROOT
    evaluatorRootEnvironment: RSI_COWORK_BENCH_EVALUATOR_ROOT
    datasetRevision: 59ee4f18b4a25f589df71652e1292cee3e115421
    evaluatorRevision: 59ee4f18b4a25f589df71652e1292cee3e115421
    manifestPath: benchmarks/cowork-bench-smoke/task-manifest.json
    manifestDigest: 3f04afb0be10fae61aa0b43cd3eb7bb411efb6e196d58f05043cf0b4292b3038
  task:
    workspacePath: /workspace
    environmentAssets: environments/omegause-officeval-assets
    maximumConcurrentTrials: 2
    workspaceLimits:
      maximumFiles: 10000
      maximumBytes: 1073741824
      maximumFileBytes: 536870912
      maximumChangedFiles: 2048
      maximumChangedBytes: 536870912
  runtime:
    image: harness-rsi/cowork-bench:v1
    dockerfile: docker/cowork-bench/Dockerfile
    verifierRunner: docker/cowork-bench/run-verifier.py
  docker:
    binary: docker
    network: bridge
    runAsCurrentUser: true
    resources:
      cpus: 4
      memory: 8g
      pids: 512
      timeoutSeconds: 3600
  modelGateway:
    image: harness-rsi/model-gateway:v1
    dockerfile: docker/model-gateway/Dockerfile
    alias: model-gateway
    port: 8080
    egressNetwork: bridge
    maximumRequestsPerRun: 4096
    maximumConcurrentRequests: 8
    maximumUpstreamRetries: 5
    resources:
      cpus: 1
      memory: 512m
      pids: 128
  verifier:
    timeoutSeconds: 1200
    resources:
      cpus: 2
      memory: 4g
      pids: 256
  reward:
    minimum: 0
    maximum: 1
    resolvedThreshold: 1
  feedback:
    maximumTextBytesPerCase: 32768
    maximumArtifactEntriesPerCase: 200
    maximumArtifactBytesPerCase: 65536
    maximumHistoryEntries: 10
    maximumHistoryBytes: 131072
